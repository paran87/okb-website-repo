<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCR Waterways — Cleaning Status</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --clean:#0B3D91;      /* dark blue — YES */
    --dirty:#F0761A;      /* orange    — NO  */
    --panel:#0E1A24; --panel-2:#16242F; --line:#243642;
    --ink:#E8EFF4; --muted:#8CA3B4; --focus:#4C8FD6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    background:var(--panel);color:var(--ink);
    display:flex;overflow:hidden;
  }

  /* ---------------- left 30% ---------------- */
  #side{
    flex:0 0 30%;max-width:30%;height:100%;
    display:flex;flex-direction:column;border-right:1px solid var(--line);
  }
  .head{padding:13px 14px 12px;border-bottom:1px solid var(--line)}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);display:block;
  }
  h1{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;
    line-height:1;margin:3px 0 4px;text-transform:uppercase;letter-spacing:.01em;
  }
  .meter{margin-top:11px}
  .meter .bar{height:9px;border-radius:2px;overflow:hidden;display:flex;background:var(--panel-2)}
  .meter .bar i{display:block;height:100%}
  .meter .nums{
    display:flex;justify-content:space-between;margin-top:6px;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);
  }
  .meter .nums b{color:var(--ink);font-weight:500}

  .tools{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap}
  input[type=search],select{
    font:inherit;font-size:12px;background:var(--panel-2);color:var(--ink);
    border:1px solid var(--line);border-radius:3px;padding:7px 9px;min-width:0;
  }
  input[type=search]{flex:1 1 110px}
  select{flex:0 0 104px}
  #clear{
    display:none;width:100%;justify-content:center;align-items:center;gap:7px;
    font:600 11.5px 'IBM Plex Sans';background:var(--focus);color:#06121C;
    border:0;border-radius:3px;padding:7px 11px;cursor:pointer;
  }
  #clear.on{display:inline-flex}
  :focus-visible{outline:2px solid var(--focus);outline-offset:1px}

  /* river list — 2 columns inside the 30% rail */
  #grid{
    flex:1 1 auto;overflow-y:auto;
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;
    background:var(--line);align-content:start;
  }
  @media (min-width:1750px){#grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .cell{
    background:var(--panel);padding:5px 8px 6px;cursor:pointer;
    border-left:2px solid transparent;display:grid;gap:3px;align-content:start;
    height:36px;overflow:hidden;
  }
  .cell:hover{background:var(--panel-2)}
  .cell.on{background:#1D3345;border-left-color:var(--focus)}
  .cell .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .cell .nm{
    font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;
    letter-spacing:.02em;text-transform:uppercase;line-height:1.12;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    transition:font-size .18s ease,opacity .18s ease;
  }
  .cell:hover .nm,.cell:focus-visible .nm{font-size:15px;opacity:.72}
  .cell.on .nm{color:#BFDDFF}
  .cell .pc{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);flex:0 0 auto}
  .cell .sb{height:4px;display:flex;border-radius:1px;overflow:hidden;background:#22323E}
  .cell .sb i{display:block;height:100%}
  .empty{grid-column:1/-1;padding:16px;font-size:12.5px;color:var(--muted);background:var(--panel)}

  /* ---------------- right 70% ---------------- */
  #map{flex:1 1 70%;height:100%;background:#DCE3E8}
  .leaflet-container{font-family:'IBM Plex Sans',sans-serif}
  .legend{
    background:rgba(14,26,36,.94);color:var(--ink);border:1px solid var(--line);
    border-radius:4px;padding:10px 12px;line-height:1.5;
  }
  .legend h4{
    margin:0 0 7px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;
  }
  .legend label{display:flex;align-items:center;gap:9px;font-size:12.5px;cursor:pointer;padding:2px 0}
  .legend .key{width:26px;height:5px;border-radius:1px;flex:0 0 26px}
  .legend .key.faded{background:#FFF;opacity:.5;border:1px solid #B9C6D0}
  .legend .row-static{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:2px 0;color:var(--muted)}
  .legend input{accent-color:var(--focus);margin:0}
  .leaflet-tooltip.tip{
    background:rgba(14,26,36,.95);border:1px solid var(--line);color:var(--ink);
    box-shadow:none;border-radius:3px;padding:6px 9px;
  }
  .leaflet-tooltip.tip:before{display:none}
  .tip .t-nm{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;text-transform:uppercase}
  .tip .t-st{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
  .leaflet-control-layers{border-radius:4px!important;border:1px solid var(--line)!important}

  #replay{
    width:100%;justify-content:center;align-items:center;display:inline-flex;
    font:600 11.5px 'IBM Plex Sans';background:var(--panel-2);color:var(--ink);
    border:1px solid var(--line);border-radius:3px;padding:7px 11px;cursor:pointer;
  }
  #replay:hover{background:#1D3345;border-color:var(--focus)}

  /* tracing status pill */
  .status{
    position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:700;
    display:flex;align-items:center;gap:10px;pointer-events:none;
    background:rgba(14,26,36,.92);border:1px solid var(--line);border-radius:100px;
    padding:8px 17px;color:var(--ink);opacity:1;transition:opacity .6s ease;
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  }
  .status.gone{opacity:0}
  .status .pulse{
    width:7px;height:7px;border-radius:50%;background:var(--focus);
    animation:pulse 1s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.status .pulse{animation:none;opacity:1}}

  @media (max-width:760px){
    body{flex-direction:column}
    #side{flex:0 0 auto;max-width:100%;width:100%;max-height:52%;border-right:0;border-bottom:1px solid var(--line)}
    #map{flex:1 1 auto;min-height:280px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}


</style>
</head>
<body>

<aside id="side">
  <div class="head">
    <span class="eyebrow">Oplan Kontra Baha · NCR</span>
    <h1>Waterway Cleaning Status</h1>
    <span class="eyebrow" id="sub"></span>
    <div class="meter">

  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="Find a waterway" aria-label="Find a waterway">
    <select id="sort" aria-label="Sort waterways">
      <option value="pct">% cleaned</option>
      <option value="name">Name</option>
      <option value="size">Length</option>
    </select>
    <button id="clear">Clear selection ✕</button>
    <button id="replay">Replay tracing ▸</button>
  </div>
  <div id="grid"></div>
</aside>

const CLEAN = '#0B3D91', DIRTY = '#F0761A', FADE = '#FFFFFF';

/* ---------------- map + base layers ---------------- */
const map = L.map('map', {preferCanvas:true, zoomControl:false});
L.control.zoom({position:'topright'}).addTo(map);

const street = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'&copy; OpenStreetMap contributors · Waterway data: DPWH'});
const light = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  maxZoom:19, subdomains:'abcd', attribution:'&copy; OpenStreetMap &copy; CARTO'});
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
  maxZoom:19, attribution:'Imagery &copy; Esri'});
light.addTo(map);
L.control.layers({'Light / plain':light,'Street map':street,'Satellite':sat},null,{position:'topright'}).addTo(map);

/* ---------------- draw every river once ---------------- */
const gCase = L.layerGroup().addTo(map),
      gYes  = L.layerGroup().addTo(map),
      gNo   = L.layerGroup().addTo(map);
const store = {};
let all = L.latLngBounds([]);

DATA.forEach(w=>{
  const rec = {w, cases:[], lines:[], pts:[], total:0, bounds:L.latLngBounds(w.segs.flatMap(s=>s.p))};
  w.segs.forEach(s=>{
    const cleaned = s.c===1;
    const cs = L.polyline(s.p,{color:'#FFFFFF',weight:6.5,opacity:.9,lineCap:'round',interactive:false});
    cs.addTo(gCase); rec.cases.push(cs);
    const ln = L.polyline(s.p,{color:cleaned?CLEAN:DIRTY,weight:3.4,opacity:.95,lineCap:'round'});
    ln.base = cleaned?CLEAN:DIRTY;
    ln.bindTooltip(
      `<div class="t-nm">${w.name}</div><div class="t-st">${cleaned?'CLEANED':'NOT CLEANED'} · ${w.pct}% of ${w.n} pts done</div>`,
      {className:'tip',sticky:true});
    ln.on('click',()=>toggle(w.name));
    ln.addTo(cleaned?gYes:gNo); rec.lines.push(ln);
    rec.pts.push(s.p); rec.total += s.p.length;
  });
  store[w.name]=rec;
  all.extend(rec.bounds);
});

/* ---------------- multi-select ---------------- */
const picked = new Set();

function restyle(){
  const any = picked.size>0;
  Object.entries(store).forEach(([name,r])=>{
    const dim = any && !picked.has(name);
    r.lines.forEach(l=>l.setStyle(dim
      ? {color:FADE, opacity:.5, weight:3}
      : {color:l.base, opacity:.95, weight:3.4}));
    r.cases.forEach(c=>c.setStyle({opacity: dim ? 0 : .9}));
  });
  // selected rivers draw on top of the faded ones
  picked.forEach(n=>{store[n].cases.forEach(c=>c.bringToFront());store[n].lines.forEach(l=>l.bringToFront())});
}
function focusWaterways(selectedNames){
  if(!selectedNames.length){
    map.fitBounds(all,{padding:[40,40],maxZoom:13,animate:true,duration:0.65});
    return;
  }
  let bounds = L.latLngBounds([]);
  selectedNames.forEach(n=>{
    const rec = store[n];
    if(rec?.bounds?.isValid()) bounds.extend(rec.bounds);
  });
  if(!bounds.isValid()) return;
  if(typeof map.flyToBounds === 'function'){
    map.flyToBounds(bounds,{padding:[52,52],maxZoom:16,duration:0.75});
  }else{
    map.fitBounds(bounds,{padding:[52,52],maxZoom:16,animate:true,duration:0.65});
  }
}
function toggle(name){
  const selecting = !picked.has(name);
  selecting ? picked.add(name) : picked.delete(name);
  restyle();
  document.getElementById('clear').classList.toggle('on', picked.size>0);
  document.getElementById('clear').textContent = `Clear selection (${picked.size}) ✕`;
  paint();
  focusWaterways([...picked]);
  if(selecting){
    traceSelected(name);
  }else{
    resetTraceState();
    names.forEach(n=>setFull(store[n]));
    pill.style.display='none';
    restyle();
  }
}
map.fitBounds(all,{padding:[24,24]});
setTimeout(()=>map.invalidateSize(),200);
window.addEventListener('resize',()=>map.invalidateSize());

/* ---------------- intro: trace each river end to end ---------------- */
const gHead = L.layerGroup().addTo(map);          // leading dot of the pen
const names = Object.keys(store);
const RIVER_MS = 1000, TOTAL_MS = 6500;
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const pill = L.DomUtil.create('div','status');
pill.innerHTML = `<span class="pulse"></span><span id="pillTxt"></span>`;
map.getContainer().appendChild(pill);
pill.style.display='none';

function setFull(r){ r.lines.forEach((l,i)=>{l.setLatLngs(r.pts[i]); r.cases[i].setLatLngs(r.pts[i])}) }
function setEmpty(r){ r.lines.forEach((l,i)=>{l.setLatLngs([]); r.cases[i].setLatLngs([])}) }

function reveal(r, k){                             // show the first k points of the river
  let used = 0, tip = null;
  for(let i=0;i<r.pts.length;i++){
    const seg = r.pts[i], take = Math.max(0, Math.min(seg.length, k-used));
    const slice = take>1 ? seg.slice(0,take) : [];
    r.lines[i].setLatLngs(slice);
    r.cases[i].setLatLngs(slice);
    if(slice.length) tip = slice[slice.length-1];
    used += seg.length;
  }
  return tip;
}

let raf = null;
let introTimer = null;
let pillTimers = [];

function resetTraceState(){
  if(raf) cancelAnimationFrame(raf);
  raf = null;
  if(introTimer){ clearTimeout(introTimer); introTimer = null; }
  pillTimers.forEach(clearTimeout);
  pillTimers = [];
  gHead.clearLayers();
}

function hidePill(message, fadeDelay=650, hideDelay=1250){
  const txt = pill.querySelector('#pillTxt');
  txt.textContent = message;
  pillTimers.push(setTimeout(()=>pill.classList.add('gone'),fadeDelay));
  pillTimers.push(setTimeout(()=>{pill.style.display='none'},hideDelay));
}

function traceSelected(name){
  const r = store[name];
  if(!r) return;
  resetTraceState();

  // Keep every other waterway fully drawn while the selected one retraces.
  names.forEach(n=>setFull(store[n]));
  restyle();
  if(reduced){ setFull(r); return; }

  setEmpty(r);
  const head = L.circleMarker([0,0],{
    radius:4,color:'#FFFFFF',weight:2,fillColor:'#4C8FD6',fillOpacity:1,interactive:false
  }).addTo(gHead);
  pill.style.display='flex';
  pill.classList.remove('gone');
  const txt = pill.querySelector('#pillTxt');
  txt.textContent = `Tracing ${name}`;
  const t0 = performance.now();

  (function step(now){
    let u = Math.min(1,(now-t0)/RIVER_MS);
    u = u*u*(3-2*u);
    const tip = reveal(r, Math.max(2,Math.ceil(u*r.total)));
    if(tip) head.setLatLng(tip);

    if(u < 1){
      raf = requestAnimationFrame(step);
    }else{
      raf = null;
      setFull(r);
      gHead.clearLayers();
      restyle();
      hidePill(`${name} traced`);
    }
  })(performance.now());
}

function trace(){
  resetTraceState();
  if(reduced){ names.forEach(n=>setFull(store[n])); return; }

  const order = names.slice().sort(()=>Math.random()-0.5);   // random river order each run
  const plan = order.map((n,i)=>({
    n, start: order.length>1 ? i*(TOTAL_MS-RIVER_MS)/(order.length-1) : 0,
    state:'wait',
    head: L.circleMarker([0,0],{radius:4,color:'#FFFFFF',weight:2,fillColor:'#4C8FD6',fillOpacity:1,interactive:false})
  }));
  names.forEach(n=>setEmpty(store[n]));

  pill.style.display='flex'; pill.classList.remove('gone');
  const txt = pill.querySelector('#pillTxt');
  const t0 = performance.now();

  (function step(now){
    const t = now - t0;
    let done = 0;
    plan.forEach(p=>{
      const r = store[p.n];
      if(t < p.start){ done += 0; return; }
      let u = Math.min(1,(t-p.start)/RIVER_MS);
      u = u*u*(3-2*u);                                        // ease in / out
      if(u >= 1){
        if(p.state!=='done'){ setFull(r); gHead.removeLayer(p.head); p.state='done' }
        done++;
        return;
      }
      if(p.state==='wait'){ p.head.addTo(gHead); p.state='run' }
      const tip = reveal(r, Math.max(2, Math.ceil(u*r.total)));
      if(tip) p.head.setLatLng(tip);
    });
    txt.textContent = `Tracing waterways · ${done}/${plan.length}`;
    if(done < plan.length){ raf = requestAnimationFrame(step) }
    else{
      raf = null; gHead.clearLayers();
      hidePill(`${plan.length} waterways mapped`,900,1700);
      restyle();                                              // re-apply any active selection
    }
  })(performance.now());
}
introTimer = setTimeout(()=>{ introTimer=null; trace(); },550); // let the first tiles land
document.getElementById('replay').onclick = trace;

/* ---------------- legend ---------------- */
const legend = L.control({position:'bottomleft'});
legend.onAdd = () => {
  const d = L.DomUtil.create('div','legend');
  d.innerHTML = `<h4>Legend</h4>
    <label><input type="checkbox" id="tYes" checked><span class="key" style="background:${CLEAN}"></span>Cleaned (YES)</label>
    <label><input type="checkbox" id="tNo" checked><span class="key" style="background:${DIRTY}"></span>Not cleaned (NO)</label>
    <div class="row-static"><span class="key faded"></span>Not selected</div>`;
  L.DomEvent.disableClickPropagation(d);
  return d;
};
legend.addTo(map);
document.getElementById('tYes').onchange = e => e.target.checked ? gYes.addTo(map) : map.removeLayer(gYes);
document.getElementById('tNo').onchange  = e => e.target.checked ? gNo.addTo(map)  : map.removeLayer(gNo);

/* ---------------- totals ---------------- */
const tot = DATA.reduce((a,w)=>a+w.n,0);
const yes = DATA.reduce((a,w)=>a+Math.round(w.n*w.pct/100),0);
document.getElementById('sub').textContent = `${DATA.length} waterways · ${tot.toLocaleString()} survey points`;
document.getElementById('mYes').style.cssText=`width:${100*yes/tot}%;background:${CLEAN}`;
document.getElementById('mNo').style.cssText =`width:${100-100*yes/tot}%;background:${DIRTY}`;
document.getElementById('nYes').textContent=`${Math.round(100*yes/tot)}%`;
document.getElementById('nNo').textContent =`${100-Math.round(100*yes/tot)}%`;

/* ---------------- river list ---------------- */
const gridEl=document.getElementById('grid'), qEl=document.getElementById('q'), sortEl=document.getElementById('sort');
function paint(){
  const q=qEl.value.trim().toUpperCase(), s=sortEl.value;
  const rows=DATA.filter(w=>w.name.includes(q)).sort((a,b)=>
    s==='name'?a.name.localeCompare(b.name):s==='size'?b.n-a.n:b.pct-a.pct);
  gridEl.innerHTML = rows.length ? rows.map(w=>`
    <div class="cell${picked.has(w.name)?' on':''}" tabindex="0" data-n="${w.name}" title="${w.name} — ${w.pct}% cleaned">
      <div class="top"><span class="nm">${w.name}</span><span class="pc">${w.pct}%</span></div>
      <div class="sb"><i style="width:${w.pct}%;background:${CLEAN}"></i><i style="width:${100-w.pct}%;background:${DIRTY}"></i></div>
    </div>`).join('')
    : `<div class="empty">No waterway matches that name. Clear the search to see all ${DATA.length}.</div>`;
}
gridEl.addEventListener('click',e=>{const c=e.target.closest('.cell'); if(c) toggle(c.dataset.n)});
gridEl.addEventListener('keydown',e=>{if(e.key==='Enter'){const c=e.target.closest('.cell'); if(c) toggle(c.dataset.n)}});
document.getElementById('clear').onclick=()=>{
  resetTraceState();
  names.forEach(n=>setFull(store[n]));
  pill.style.display='none';
  picked.clear(); restyle();
  focusWaterways([]);
  document.getElementById('clear').classList.remove('on'); paint();
};
qEl.oninput = sortEl.onchange = paint;
paint();

</script>
</body>
