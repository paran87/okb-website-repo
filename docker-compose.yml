# OKB Command Center - local & production-like orchestration.
# Usage:
#   docker compose up -d db           # start only the database (for `npm run dev`)
#   docker compose up -d --build      # full stack (db + app + nginx)

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: okb_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: okb
      POSTGRES_PASSWORD: okb_password
      POSTGRES_DB: okb_command_center
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okb -d okb_command_center"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: okb_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://okb:okb_password@db:5432/okb_command_center?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-please-0123456789}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_NAME: "OKB Command Center"
      NEXT_PUBLIC_APP_ENV: production
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: okb_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data:
    driver: local
